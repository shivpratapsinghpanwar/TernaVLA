<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Proposed TernaVLA action interface</title><desc id="desc">INT8 vision and context feed a ternary language model, followed by a floating-point head producing 52 steps for 17 joints. This is a proposed architecture, not a trained end-to-end result.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5" fill="#6f8b9d"/></marker></defs>
<rect width="1000" height="330" rx="18" fill="#0d1925"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="34" y="42" fill="#eef4f7" font-size="22" font-weight="600">One image. One forward pass. A motion chunk.</text><text x="34" y="69" fill="#9bb0bf" font-size="13">PROPOSED INTERFACE · current recipe uses INT8 vision and a floating-point action head</text>
<rect x="34" y="94" width="211" height="146" rx="14" fill="#122330" stroke="#2b414f"/><text x="52" y="123" font-size="11" fill="#61d4c4" letter-spacing="1.1">01 / SEE</text><text x="52" y="158" font-size="22" fill="#f2f6f9" font-weight="600">Camera</text><text x="52" y="189" font-size="13" fill="#afc0cd">256 × 256 RGB</text><text x="52" y="211" font-size="13" fill="#afc0cd">SigLIP2 · INT8</text><path d="M 250 165 h 18" stroke="#6f8b9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="94" width="211" height="146" rx="14" fill="#122330" stroke="#2b414f"/><text x="293" y="123" font-size="11" fill="#61d4c4" letter-spacing="1.1">02 / CONDITION</text><text x="293" y="158" font-size="22" fill="#f2f6f9" font-weight="600">Context tokens</text><text x="293" y="189" font-size="13" fill="#afc0cd">16 or 64 image tokens</text><text x="293" y="211" font-size="13" fill="#afc0cd">+ instruction, state, prefix</text><path d="M 491 165 h 18" stroke="#6f8b9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="94" width="211" height="146" rx="14" fill="#122330" stroke="#2b414f"/><text x="534" y="123" font-size="11" fill="#bca7ff" letter-spacing="1.1">03 / INFER</text><text x="534" y="158" font-size="22" fill="#f2f6f9" font-weight="600">Ternary LM</text><text x="534" y="189" font-size="13" fill="#afc0cd">Weights in {−1, 0, +1}</text><text x="534" y="211" font-size="13" fill="#afc0cd">13 causal action queries</text><path d="M 732 165 h 18" stroke="#6f8b9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="757" y="94" width="211" height="146" rx="14" fill="#122330" stroke="#2b414f"/><text x="775" y="123" font-size="11" fill="#ffb775" letter-spacing="1.1">04 / DECODE</text><text x="775" y="158" font-size="22" fill="#f2f6f9" font-weight="600">Action head</text><text x="775" y="189" font-size="13" fill="#afc0cd">Floating-point MLP</text><text x="775" y="211" font-size="13" fill="#afc0cd">13 × 4 × 17 outputs</text><text x="34" y="285" fill="#61d4c4" font-size="20" font-weight="600">52 steps × 17 joints at 50 Hz = 1.04 s of motion</text><text x="34" y="311" fill="#9bb0bf" font-size="13">Model capability and runtime still require validation with trained weights.</text></g></svg>